# =============================================================================
# Stokowski — Example State Machine Workflow
# =============================================================================
#
# Copy this file to workflow.yaml and customise for your project.
# Stokowski re-reads this file on every poll tick — changes take effect
# without restart.
#
# Prompt files live in the prompts/ directory.  Each agent state references
# its prompt via the `prompt` field.  A global prompt (shared preamble) is
# injected before the stage-specific prompt when set.
#
# Linear states mapping:
#   active        → the "working" state for agent stages
#   review        → human review / PR review state
#   gate_approved → approved — agent advances to next state
#   rework        → human requested changes — agent re-enters rework target
#   terminal      → list of done/closed states
#
# State types:
#   agent    — Stokowski dispatches Claude Code in this state
#   gate     — pauses for human review; approve → next, rework → rework_to
#   terminal — issue is finished; workspace cleaned up
#
# -----------------------------------------------------------------------------
# Multi-project mode (optional — single-project YAML still works as-is)
# -----------------------------------------------------------------------------
#
# To monitor multiple Linear projects from one Stokowski process, replace
# top-level `tracker/workspace/hooks/prompts/states` with `projects:`.
# Top-level `polling`, `agent`, `claude`, `linear_states`, and `server` stay
# global and act as defaults each project can override.
#
#   agent:
#     max_concurrent_agents: 8
#     max_concurrent_per_project:
#       my-project: 6
#
#   projects:
#     - name: my-project
#       tracker:
#         kind: linear
#         project_slug: "abc123def456"
#         api_key: "$LINEAR_API_KEY"
#       workspace:
#         root: ~/.local/share/stokowski/workspaces/my-project
#       hooks: { after_create: "git clone git@github.com:org/repo.git ." }
#       prompts: { global_prompt: prompts/my-project/global.md }
#       states: { ... }
#
# In the terminal, `p` opens a numbered pause menu; in the web dashboard,
# each project tile gets a Pause/Resume button and a per-project filter.
#
# -----------------------------------------------------------------------------
# Project templates (optional — reduces duplication across similar projects)
# -----------------------------------------------------------------------------
#
# Define a reusable `templates:` block and reference it with `template:` in
# each project. Merge priority (highest wins):
#   project block > template > top-level defaults.
#
# Simple fields (tracker, workspace, hooks, prompts) are shallow-merged.
# Deep fields (linear_states, claude) are deep-merged.
# States are merged by key: a project can override one state without touching
# others.
#
# Templates cannot reference other templates (single-layer only).
#
#   templates:
#     default-project:
#       tracker:
#         kind: linear
#         api_key: "$LINEAR_API_KEY"
#       hooks:
#         after_create: git clone git@github.com:org/repo.git .
#       prompts:
#         global_prompt: prompts/global.md
#       claude:
#         model: claude-sonnet-4-6
#         max_turns: 20
#       linear_states:
#         todo: "Todo"
#         active: "In Progress"
#         terminal: ["Done", "Closed"]
#       states:
#         investigate:
#           type: agent
#           prompt: prompts/investigate.md
#           transitions: { complete: done }
#         done:
#           type: terminal
#           linear_state: terminal
#
#   projects:
#     - name: project-a
#       template: default-project
#       tracker:
#         project_slug: "abc123"
#     - name: project-b
#       template: default-project
#       tracker:
#         project_slug: "def456"
#       claude:
#         model: claude-opus-4-7
#
# -----------------------------------------------------------------------------
# Label routing (optional — select a template by issue label)
# -----------------------------------------------------------------------------
#
# Use `label_routing` to select which template's state machine applies to each
# issue, based on its Linear labels. An issue with no matching label falls
# back to the project's `template:` (or its first agent state).
#
# Example: the same project handles bug, feature, and idea tickets:
#
#   templates:
#     bug-flow:
#       states:
#         debug:
#           type: agent; prompt: prompts/debug.md
#           transitions: { complete: review }
#         review:
#           type: gate; linear_state: review; rework_to: debug
#           transitions: { approve: merge }
#         merge:
#           type: agent; prompt: prompts/merge.md
#           transitions: { complete: done }
#         done:
#           type: terminal; linear_state: terminal
#
#     feature-flow:
#       states:
#         plan:
#           type: agent; prompt: prompts/plan.md
#           transitions: { complete: work }
#         work:
#           type: agent; prompt: prompts/work.md
#           transitions: { complete: review }
#         review:
#           type: gate; linear_state: review; rework_to: work
#           transitions: { approve: merge }
#         merge:
#           type: agent; prompt: prompts/merge.md
#           transitions: { complete: done }
#         done:
#           type: terminal; linear_state: terminal
#
#     idea-flow:
#       states:
#         brainstorm:
#           type: agent; prompt: prompts/brainstorm.md
#           transitions: { complete: plan }
#         plan:
#           type: agent; prompt: prompts/plan.md
#           transitions: { complete: work }
#         work:
#           type: agent; prompt: prompts/work.md
#           transitions: { complete: review }
#         review:
#           type: gate; linear_state: review; rework_to: work
#           transitions: { approve: merge }
#         merge:
#           type: agent; prompt: prompts/merge.md
#           transitions: { complete: done }
#         done:
#           type: terminal; linear_state: terminal
#
#   projects:
#     - name: default
#       tracker:
#         project_slug: "abc123def456"
#         api_key: "$LINEAR_API_KEY"
#       template: bug-flow              # default for unmatched labels
#       label_routing:
#         bug: bug-flow
#         feature: feature-flow
#         idea: idea-flow
# =============================================================================

# ---------------------------------------------------------------------------
# Linear state name mapping  (global default — overridden per project)
# ---------------------------------------------------------------------------
# These map Stokowski's internal lifecycle roles to your Linear state names.
# You can rename values to match your Linear setup, but all roles are required.
linear_states:
  todo: "Todo"                        # issues picked up from this state
  active: "In Progress"               # moved here automatically when agent starts
  review: "Human Review"              # agent pauses here at a gate for human review
  gate_approved: "Gate Approved"       # approved — agent advances to next state
  rework: "Rework"                    # human requested changes — agent re-enters rework target
  terminal:                           # issues in these states stop any running agent
    - Done
    - Closed
    - Cancelled
    - Canceled
    - Duplicate

# ---------------------------------------------------------------------------
# Polling
# ---------------------------------------------------------------------------
polling:
  interval_ms: 15000              # 15 seconds between ticks

# ---------------------------------------------------------------------------
# Claude defaults (inherited by all agent states unless overridden)
# ---------------------------------------------------------------------------
claude:
  permission_mode: auto
  model: claude-sonnet-4-6
  max_turns: 20
  turn_timeout_ms: 3600000        # 1 hour per turn
  stall_timeout_ms: 300000        # 5 minutes with no output → kill

# ---------------------------------------------------------------------------
# Agent concurrency
# ---------------------------------------------------------------------------
agent:
  max_concurrent_agents: 4
  max_retry_backoff_ms: 300000    # 5-minute cap on exponential backoff
  max_concurrent_agents_by_state:
    investigate: 2                # allow 2 concurrent investigations
    implement: 2
    code-review: 1                # serial reviews prevent merge conflicts

# ---------------------------------------------------------------------------
# Server (optional web dashboard)
# ---------------------------------------------------------------------------
server:
  port: 4200

# ---------------------------------------------------------------------------
# Auto fast-track (unattended) — enabled by labeling an issue "auto"
# ---------------------------------------------------------------------------
# Issues labeled "auto" skip human gates entirely. The flow is:
#   auto-implement → auto-implementation-review (auto gate, auto-approve)
#                  → auto-code-review → auto-merge-review (auto gate, auto-approve)
#                  → auto-merge → done
#
# Auto gates have label_mode: auto — Stokowski auto-approves them when the
# issue carries the matching auto label, skipping human review entirely.
# If rework is triggered on an auto gate, it returns to auto-implement.

templates:
  auto-flow:
    prompts:
      global_prompt: prompts/global.example.md
    states:
      auto-implement:
        type: agent
        prompt: prompts/implement.example.md
        linear_state: active
        model: claude-sonnet-4-6
        max_turns: 30
        session: inherit
        transitions:
          complete: auto-implementation-review

      auto-implementation-review:
        type: gate
        linear_state: review
        label_mode: auto          # auto-approve when issue has the "auto" label
        rework_to: auto-implement
        max_rework: 3
        transitions:
          approve: auto-code-review

      auto-code-review:
        type: agent
        prompt: prompts/review.example.md
        linear_state: active
        model: claude-opus-4-6
        max_turns: 10
        session: fresh
        transitions:
          complete: auto-merge-review

      auto-merge-review:
        type: gate
        linear_state: review
        label_mode: auto          # auto-approve when issue has the "auto" label
        rework_to: auto-implement
        max_rework: 3
        transitions:
          approve: auto-merge

      auto-merge:
        type: agent
        prompt: prompts/merge.example.md
        linear_state: active
        max_turns: 5
        session: inherit
        transitions:
          complete: done

      done:
        type: terminal
        linear_state: terminal

# Label routing — maps Linear label to template / state machine
label_routing:
  auto: auto-flow

projects:
  - name: default
    tracker:
      kind: linear
      project_slug: "abc123def456"    # hex slugId from your Linear project URL
      api_key: "$LINEAR_API_KEY"
    workspace:
      root: ~/code/stokowski-workspaces
    hooks:
      after_create: |
        git clone --depth 1 git@github.com:your-org/your-repo.git .
        npm install
      before_run: |
        git fetch origin main
        git rebase origin/main 2>/dev/null || git rebase --abort
      timeout_ms: 120000
    template: auto-flow         # auto-label → auto-flow; default also uses it
